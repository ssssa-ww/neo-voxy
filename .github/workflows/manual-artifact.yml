name: manual-artifact

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Download Voxy WorldGen dependency
        run: |
          dependency_url="$(curl -fsSL 'https://api.modrinth.com/v2/project/voxy-worldgen/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D' | jq -r '.[] | select(.version_number == "2.4.2") | .files[0].url' | head -n 1)"
          test -n "$dependency_url"
          curl -fsSL "$dependency_url" -o "../Voxy World Gen V2-neoforge-1.21.1-2.4.2.jar"

      - name: Gradle build
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxy-artifacts
          path: build/libs/*.jar
